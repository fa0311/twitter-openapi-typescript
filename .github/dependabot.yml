version: 2
updates:
  - package-ecosystem: npm
    directory: /twitter-openapi-typescript
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ['*']
      security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: npm
    directory: /twitter-openapi-typescript-generated
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
